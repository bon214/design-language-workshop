実装コストをかける根拠は？`],[`PD`,`（インタビューや観察の情報はあるけれど……）`]],bottom:`情報はあるが、それをどう根拠として扱い、説明したらいいかが分からない。`,note:`09:06–09:08。添付PDFの3ページを反映。情報を集めたことと、その情報を根拠として課題や選択理由を説明できることを区別する。`},{chapter:0,kind:`conversation`,tag:`シチュエーション 3`,title:`この機能で何を検証するのか？`,items:[[`PdM / Devs`,`この機能で何を検証するのか？`,`成功・失敗したら何がわかるのか？`]],bottom:`「何を確かめるために作ったのか」を言語化できない。`,note:`09:08–09:10。添付PDFの4ページを反映。作る機能と、確かめたいことを結びつけて説明できない場面。`},{chapter:0,kind:`judgment-gap`,tag:`コミュニケーションの課題`,title:`デザイン提案時に起きていること`,items:[[`ユーザー・コンテキスト`,`事実（FACT）`],[`洞察`,`Insight`],[`仮説`,`Hypothesis`],[`課題解決した姿の定義`,`Target State`],[`解決方法・検証方法の検討`,`Solution & Validation`],[`判断`,`Decision`]],bottom:`判断に至るまでに検討したことは、デザインを見てもらうだけでは伝わらない`,note:`09:10–09:15。添付PDFの5ページを反映。情報と最終的な判断の間にある洞察・仮説・目指す姿・解決方法と検証方法の検討が、相手には見えていないことを図で示す。資料の「PD &」は「PDと他職種」と補った。今日はこの途中を言葉にし、根拠を共有してチームで次の判断を進める。`},{chapter:0,kind:`agenda`,title:`今日のタイムスケジュール`,note:`09:25–09:30。8時間枠・休憩90分・実施390分。午後の実案件・レビュー・更新を優先する。各章の時刻は目安。右上「進行・目次」から全スライドへ移動できる。`},{chapter:1,kind:`design-layers`,title:`デザイン提案で伝わることには二つの層がある`,items:[[`相手から見える層`,`画面・導線・文言・状態など`,`受け取った人がその場で見られるもの`],[`相手から見えない層`,`観察結果・PDの解釈
仮説・解決したいこと`,`説明されなければ相手が推測するしかないもの`]],note:`09:30–09:36。成果物を示すだけでは判断過程は伝わらない。完成したUIを説明する前に、どんな材料をつないだかを共有する。`,bottom:`UIは成果物。開発では、そのデザインを決定した意図も求められる。`},{chapter:1,kind:`role-perspectives`,title:`同じ情報を見ても、前提が違えば解釈も変わる`,items:[[`PD`,`Desirability`,`ユーザーの問題を解き
望ましい体験になるか`],[`PM`,`Viability`,`ユーザー価値を事業成果へ
接続できるか`],[`Devs`,`Feasibility`,`技術的に適切かつ持続可能
な方法で実現できるか`]],note:`09:36–09:42。役割ごとの関心は例であり固定的な分業ではない。全員がユーザー価値・事業・技術の観点を持つ。専門用語の詳細講義はしない。`},{chapter:1,kind:`shared-understanding`,title:`コミュニケーションエラーを減らす二つの方法`,items:[[`一緒に現場を見て、
一緒に検討する`,`一緒にリサーチ・検討を行うことで
双方の気づきや解釈の違いの擦り合わせをすぐに行う`,`例：インタビューや利用場面の観察に同席する`],[`デザインの根拠を共有し
それを元に次のアクションを一緒に考える`,`提案するデザインだけでなく、なぜこのデザインを提案したかまで相手に伝え、それを踏まえてチームで次のアクションを検討する`]],bottom:`大切なのは双方の違う目線・解釈を共有し、チームとしてより良い意思決定を行うこと`,note:`前のページの「同じ情報でも解釈が変わる」を受けて説明する。①は同じ現場を見て、各職種が何に注目したかを話し合う方法。同席しただけで解釈が一致するわけではない。②はデザインの根拠と解釈を言語化して共有し、未確認のことと次の行動を一緒に決める方法。二つは併用できる。このワークショップでは、特に②で必要になる判断過程の言語化を練習する。次の7項目につなげる。`},{chapter:1,kind:`steps-overview`,title:`デザインの言語化7ステップ`,note:`09:42–09:52。7項目を1つずつ講義しすぎない。USERからDECISIONまで一度読む。4つの問いでは、①1–2、②3–4、③5、④6–7と次の検証に対応する。紙やメモに7項目の見出しを作ってもらう。`,tag:`02 / テンプレート`,items:[[`誰？`,`USER / CONTEXT`],[`何が起きている？`,`FACT`],[`背景に何がある？`,`INTERPRETATION / INSIGHT`],[`何が課題？`,`PROBLEM / NEED`],[`どうなってほしい？`,`TARGET UX`],[`５を実現する為には`,`ALTERNATIVES`],[`なぜこの方法を選ぶ？`,`DESIGN DECISION`]]},{chapter:1,kind:`comic-aside`,title:`ってこんなに伝える時間ないんだけど！`,sub:`・・・って聞こえてきました。`,note:`7ステップを見て「毎回こんなに説明できない」と感じる参加者の気持ちを代弁し、少し間を取る。7項目は毎回すべて読み上げる台本ではなく、判断を整理するための道具。相手の問いや状況に合わせて、必要な根拠を取り出して伝えればよいと補足する。`},{chapter:1,kind:`compact-template`,tag:`02 / テンプレート`,title:`デザインの言語化テンプレート`,items:[[`何が起きている？`,`ユーザー・状況・事実`],[`何が課題？`,`解釈・課題`],[`どうなれば良い？`,`目指す状態・選択肢`],[`何を提供する？`,`価値`]],note:`7ステップを、会話の入口になる4つの問いにまとめた版。まず短く全体像を伝え、相手の問いに応じて7ステップの根拠や比較に戻る。まとめの一文では、状況・課題・目指す状態・選んだ方法をつなぐ。`},{chapter:1,kind:`gherkin-example`,tag:`02 / 説明の組み立て`,title:`実は、すでにやっていること`,items:[[`Given`,`太郎は空腹である`],[`When`,`太郎はきゅうりを50本食べる`],[`Then`,`太郎は満腹になる`]],bottom:`でも、これだけだと深い理解は難しい`,note:`Gherkin記法の例を使って、前提・行動・結果を整理する書き方はすでに身近にあると伝える。きゅうりの例は説明用の架空のシナリオ。なぜその行動や方法を選ぶのか、背景や意図まで共有することにつなげる。`},{chapter:1,kind:`role-dialogue`,tag:`02 / 説明の組み立て`,title:`だからこそ、相手の視点に立って話そう`,items:[[`PdM`,`どれくらいかかる？（お金・時間）
どれくらい利益を生む？（ROI）
